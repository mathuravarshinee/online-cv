experiences:
  title: Experiences
  info:
  - role: <strong>Application Security Analyst – Information Security</strong>
    time: April 2026 – Present
    company: <strong>SMBC · Contract | Charlotte, NC</strong>
    details: |
      - Facilitate application security risk assessment interviews and cloud security assessments with <strong>50+ stakeholders across 15+ business units</strong>, supporting a portfolio of <strong>900 applications</strong> with a <strong>98% completion rate</strong>.
      - Complete <strong>10+ assessments weekly</strong>, translating technical and business inputs into standardized risk and control documentation aligned with <strong>NIST, ISO 27001,</strong> and internal banking standards.
      - Review application assessment evidence and <strong>SOC reports</strong> to validate control implementation against security policies and regulatory requirements.
      - Prepare and process <strong>10+ risk acceptance requests weekly</strong>, documenting control gaps, business justification, and remediation considerations.
      - Triage <strong>high-risk findings</strong> and coordinate escalation to appropriate security teams while maintaining audit-ready assessment and communication records.
      - Use <strong>AI-assisted review workflows</strong> to reduce average documentation review time from <strong>three days to approximately 1.5–2 days</strong>, improving assessment throughput and consistency.
      
  - role: <strong>Senior Security Consultant </strong>
    time: 2021 - 2024
    company: <strong>WIPRO, INDIA</strong>
    details: |
     Project : <strong>Lloyds Banking Group</strong>
      - Led security optimization and gap assessments across applications and systems, ensuring alignment with <strong>ISO 27001, GDPR, NIST CSF,</strong> and <strong>regulatory standards</strong>.
      - Designed and validated security controls across different environments to strengthen compliance and control effectiveness.
      - Managed <strong>vulnerability assessments, penetration testing,</strong> and <strong>remediation</strong>, enhancing detection accuracy and reducing false positives.
      - Collaborated with Security, Engineering, and Risk teams to implement risk-based action plans and maintain control and accountability.
      - Developed and maintained security documentation and runbooks, standardizing first-line risk management processes.
      - Delivered <strong>cost savings</strong> of <strong>~£2,000</strong> through optimized testing and remediation workflows.
      - Mentored a <strong>15-member team</strong>, driving collaboration, compliance, and continuous improvement.
